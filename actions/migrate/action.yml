name: 'Migrate Database'
description: 'Run database migrations through the VPN (npm run migrate) with retries and a readable failure report'

inputs:
  app-name:
    description: 'Name of the application'
    required: true
  github-token:
    description: 'GitHub token for installing private packages'
    required: true
  vpn-conf:
    description: 'VPN configuration'
    required: true
  vpn-client-cert:
    description: 'VPN client certificate'
    required: true
  vpn-client-key:
    description: 'VPN client key'
    required: true
  vpn-ca-cert:
    description: 'VPN CA certificate'
    required: true
  vpn-ta-key:
    description: 'VPN TLS auth key'
    required: true
  pg-host:
    description: 'PostgreSQL host'
    required: true
  pg-user:
    description: 'PostgreSQL user'
    required: true
  pg-password:
    description: 'PostgreSQL password'
    required: true
  pg-db:
    description: 'PostgreSQL database name'
    required: true
  deploy-env:
    description: 'Target environment (integration, uat, prod)'
    required: true
  tars-slack-webhook-url:
    description: 'Slack webhook URL for notifications'
    required: true
  migrate-command:
    description: 'Migration command; use "npm run migrate:status" for a read-only dry run'
    required: false
    default: 'npm run migrate'

runs:
  using: "composite"
  steps:
    - name: Check migration secrets
      run: bash "$GITHUB_ACTION_PATH/../_shared/run-migration.sh" --check-secrets
      shell: bash
      env:
        PG_HOST: ${{ inputs.pg-host }}
        PG_USER: ${{ inputs.pg-user }}
        PG_PASSWORD: ${{ inputs.pg-password }}
        PG_DB: ${{ inputs.pg-db }}
        APP_NAME: ${{ inputs.app-name }}
        DEPLOY_ENV: ${{ inputs.deploy-env }}

    # Setup work overlaps: openvpn installs while Node is set up and dependencies install while the
    # VPN connects. Each "Wait for ..." step joins its background job and fails with its output.
    - name: Install OpenVPN (background)
      run: |
        # The image's package lists already know openvpn; refreshing them costs ~12s, so only on a miss.
        bash "$GITHUB_ACTION_PATH/../_shared/background.sh" start openvpn-install sudo bash -c \
          'apt-get install -y -qq --no-install-recommends openvpn || { apt-get update -qq && apt-get install -y -qq --no-install-recommends openvpn; }'
      shell: bash

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Install dependencies (background)
      run: bash "$GITHUB_ACTION_PATH/../_shared/background.sh" start npm-ci npm ci --no-audit --no-fund
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Wait for OpenVPN
      run: bash "$GITHUB_ACTION_PATH/../_shared/background.sh" wait openvpn-install 180
      shell: bash

    - name: Set Up VPN Config
      run: bash "$GITHUB_ACTION_PATH/../_shared/write-vpn-config.sh"
      shell: bash
      env:
        VPN_CONFIG: ${{ inputs.vpn-conf }}
        VPN_CLIENT_CERT: ${{ inputs.vpn-client-cert }}
        VPN_CLIENT_KEY: ${{ inputs.vpn-client-key }}
        VPN_CA_CERT: ${{ inputs.vpn-ca-cert }}
        VPN_TA_KEY: ${{ inputs.vpn-ta-key }}

    - name: Connect to VPN
      id: vpn
      run: bash "$GITHUB_ACTION_PATH/../_shared/connect-vpn.sh" vpn.conf
      shell: bash

    - name: Wait for dependencies
      id: dependencies
      run: bash "$GITHUB_ACTION_PATH/../_shared/background.sh" wait npm-ci 300
      shell: bash

    - name: Run database migration
      id: migration
      run: bash "$GITHUB_ACTION_PATH/../_shared/run-migration.sh"
      shell: bash
      continue-on-error: true
      env:
        PG_HOST: ${{ inputs.pg-host }}
        PG_USER: ${{ inputs.pg-user }}
        PG_PASSWORD: ${{ inputs.pg-password }}
        PG_DB: ${{ inputs.pg-db }}
        PG_SSL: "true"
        APP_NAME: ${{ inputs.app-name }}
        DEPLOY_ENV: ${{ inputs.deploy-env }}
        MIGRATION_COMMAND: ${{ inputs.migrate-command }}
        VPN_CONNECT_SCRIPT: ${{ github.action_path }}/../_shared/connect-vpn.sh

    - name: Disconnect VPN
      if: always()
      run: |
        sudo pkill -x openvpn || true
        echo "VPN disconnected"
      shell: bash

    - name: Send Slack notification
      if: always()
      run: |
        if [[ "$MIGRATION_OUTCOME" == "success" ]]; then
          STATUS="SUCCESS"
          COLOR="good"
          FOOTER="${APPLIED:+Applied: ${APPLIED}}"
          FOOTER="${FOOTER:-No pending migrations}"
        else
          STATUS="FAILED"
          COLOR="danger"
          if [[ -z "$STAGE" ]]; then
            if [[ "$VPN_OUTCOME" == "failure" ]]; then STAGE="VPN"; REASON="the tunnel did not come up"
            elif [[ "$DEPENDENCIES_OUTCOME" == "failure" ]]; then STAGE="Dependencies"; REASON="npm ci failed"
            else STAGE="Setup"; REASON="a setup step failed before the migration ran"
            fi
          fi
          FOOTER="Failed at ${STAGE}: ${REASON}. Nothing was rolled back automatically."
        fi

        PAYLOAD=$(jq -n \
          --arg color "$COLOR" --arg status "$STATUS" --arg app "$APP_NAME" --arg env "$DEPLOY_ENV" \
          --arg run "<${RUN_URL}|#${RUN_NUMBER}>" --arg repo "$REPOSITORY" --arg branch "$BRANCH" --arg footer "$FOOTER" \
          '{attachments: [{color: $color, footer: $footer, fields: [
            {title: "Migration Status", value: $status, short: true},
            {title: "Application", value: $app, short: true},
            {title: "Environment", value: $env, short: true},
            {title: "Run", value: $run, short: true},
            {title: "Repository", value: $repo, short: false},
            {title: "Branch", value: $branch, short: true}
          ]}]}')

        curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          || echo "Warning: Slack notification failed"
      shell: bash
      env:
        MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
        VPN_OUTCOME: ${{ steps.vpn.outcome }}
        DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        STAGE: ${{ steps.migration.outputs.stage }}
        REASON: ${{ steps.migration.outputs.reason }}
        APPLIED: ${{ steps.migration.outputs.applied }}
        APP_NAME: ${{ inputs.app-name }}
        DEPLOY_ENV: ${{ inputs.deploy-env }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        REPOSITORY: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        SLACK_WEBHOOK_URL: ${{ inputs.tars-slack-webhook-url }}

    - name: Fail if migration failed
      if: steps.migration.outcome == 'failure'
      run: exit 1
      shell: bash
