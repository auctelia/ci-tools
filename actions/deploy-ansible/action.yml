name: 'Deploy via VPN'
description: 'Connect to VPN and deploy Docker image via Ansible script'

inputs:
  docker-username:
    description: "Docker username for authentication"
    default: ${{ github.actor }}
    required: false
  docker-password:
    description: "Docker password for authentication"
    required: false
  app-name:
    description: "Name of the application to deploy"
    required: true
  version-number:
    description: "Version number for the deployment"
    default: ${{ github.run_number }}
    required: true
  docker-registry:
    description: "Docker registry URL. If not provided, defaults to Github Docker Hub."
    default: "ghcr.io"
    required: false
  vpn-conf:
    description: "VPN configuration"
    required: true
  vpn-client-cert:
    description: "VPN client certificate"
    required: true
  vpn-client-key:
    description: "VPN client key"
    required: true
  vpn-ca-cert:
    description: "VPN CA certificate"
    required: true
  vpn-ta-key:
    description: "VPN TLS auth key"
    required: true
  docker-image:
    description: "Docker image to deploy"
    required: false
  awx-username:
    description: "AWX username for authentication"
    required: true
  awx-password:
    description: "AWX password for authentication"
    required: true
  awx-services-id:
    description: "AWX services ID for deployment"
    required: true
  tars-slack-webhook-url:
    description: "Slack webhook URL for notifications"
    required: true
  deploy-env:
    description: "Deployment environment (e.g., staging,test, production)"
    default: "staging"
    required: true
  health-check-url:
    description: "URL to check deployment health (optional)"
    required: false
  health-check-timeout:
    description: "Timeout in seconds for health check"
    default: "300"
    required: false
  rollback-enabled:
    description: "Enable automatic rollback on deployment failure"
    default: "true"
    required: false
  time-bypass:
    description: "Bypass time-based deployment restrictions in AWX"
    default: "false"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y openvpn jq
      shell: bash
    
    - name: Set Up VPN Config
      run: bash "$GITHUB_ACTION_PATH/../_shared/write-vpn-config.sh"
      shell: bash
      env:
        VPN_CONFIG: ${{ inputs.vpn-conf }}
        VPN_CLIENT_CERT: ${{ inputs.vpn-client-cert }}
        VPN_CLIENT_KEY: ${{ inputs.vpn-client-key }}
        VPN_CA_CERT: ${{ inputs.vpn-ca-cert }}
        VPN_TA_KEY: ${{ inputs.vpn-ta-key }}

    - name: Connect to VPN
      run: bash "$GITHUB_ACTION_PATH/../_shared/connect-vpn.sh" vpn.conf
      shell: bash

    - name: Get Current Deployment State
      id: get-current-state
      run: |
          RESPONSE=$(curl -sS --max-time 30 --connect-timeout 10 \
            -u "${{ inputs.awx-username }}:${{ inputs.awx-password }}" \
            "http://ansible.cluster.auctelia.com/api/v2/job_templates/${{ inputs.awx-services-id }}/jobs/?status=successful&order_by=-finished&page_size=200" \
            || echo '{"results":[]}')

          CURRENT_VERSION=$(jq -r --arg deploy_env "${{ inputs.deploy-env }}" '
            def job_vars:
              if (.extra_vars | type) == "string"
              then (.extra_vars | fromjson? // {})
              else (.extra_vars // {})
              end;

            first(
              .results[]
              | job_vars
              | select(.deploy_env == $deploy_env)
              | .deploy_image_tag
            ) // "unknown"
          ' <<<"$RESPONSE" 2>/dev/null || echo "unknown")

          echo "current-version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Previous deployment version: ${CURRENT_VERSION}"
      shell: bash

    - name: Call Ansible Deployment API
      id: deploy
      run: |
          AWX_EXTRA_VARS=$(jq -nc \
            --arg deploy_env "${{ inputs.deploy-env }}" \
            --arg deploy_image_tag "v${{ inputs.version-number }}" \
            --arg docker_image "${{ inputs.docker-image }}" \
            --arg time_bypass "${{ inputs.time-bypass }}" \
            '{
              deploy_env: $deploy_env,
              deploy_image_tag: $deploy_image_tag,
              docker_image: $docker_image,
              time_bypass: $time_bypass
            }')
          AWX_MATCH_VARS=$(jq -c 'del(.time_bypass)' <<<"$AWX_EXTRA_VARS")

          export AWX_EXTRA_VARS AWX_MATCH_VARS
          bash "$GITHUB_ACTION_PATH/../_shared/launch-awx-job.sh"
      shell: bash
      env:
        AWX_TEMPLATE_ID: ${{ inputs.awx-services-id }}
        AWX_USERNAME: ${{ inputs.awx-username }}
        AWX_PASSWORD: ${{ inputs.awx-password }}
        VPN_CONNECT_SCRIPT: ${{ github.action_path }}/../_shared/connect-vpn.sh

    - name: Wait for Deployment to Complete
      id: wait-deploy
      run: bash "$GITHUB_ACTION_PATH/../_shared/poll-awx-job.sh"
      shell: bash
      env:
        AWX_JOB_ID: ${{ steps.deploy.outputs.job-id }}
        AWX_USERNAME: ${{ inputs.awx-username }}
        AWX_PASSWORD: ${{ inputs.awx-password }}
        AWX_STATUS_OUTPUT: deployment-status
        VPN_CONNECT_SCRIPT: ${{ github.action_path }}/../_shared/connect-vpn.sh

    - name: Health Check (if URL provided)
      id: health-check
      if: inputs.health-check-url != ''
      run: |
          HEALTH_URL="${{ inputs.health-check-url }}"
          TIMEOUT="${{ inputs.health-check-timeout }}"
          ELAPSED=0
          INTERVAL=5
          
          echo "Starting health check on: ${HEALTH_URL}"
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            
            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "health-status=healthy" >> $GITHUB_OUTPUT
              echo "Health check passed! HTTP $HTTP_CODE"
              exit 0
            else
              echo "Health check failed with HTTP $HTTP_CODE (elapsed: ${ELAPSED}s)"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            fi
          done
          
          echo "health-status=unhealthy" >> $GITHUB_OUTPUT
          echo "Health check failed after ${TIMEOUT} seconds"
          exit 1
      shell: bash

    - name: Start Rollback
      id: start-rollback
      if: >-
        failure() &&
        inputs.rollback-enabled == 'true' &&
        steps.get-current-state.outputs.current-version != 'unknown' &&
        (
          steps.wait-deploy.outputs.deployment-status == 'failed' ||
          (
            steps.wait-deploy.outputs.deployment-status == 'success' &&
            steps.health-check.outcome == 'failure'
          )
        )
      run: |
          PREVIOUS_VERSION="${{ steps.get-current-state.outputs.current-version }}"
          PREVIOUS_IMAGE="${{ inputs.docker-image }}"
          PREVIOUS_IMAGE="${PREVIOUS_IMAGE%:*}:${PREVIOUS_VERSION}"

          AWX_EXTRA_VARS=$(jq -nc \
            --arg deploy_env "${{ inputs.deploy-env }}" \
            --arg deploy_image_tag "$PREVIOUS_VERSION" \
            --arg docker_image "$PREVIOUS_IMAGE" \
            --arg time_bypass "${{ inputs.time-bypass }}" \
            '{
              deploy_env: $deploy_env,
              deploy_image_tag: $deploy_image_tag,
              docker_image: $docker_image,
              time_bypass: $time_bypass
            }')
          AWX_MATCH_VARS=$(jq -c 'del(.time_bypass)' <<<"$AWX_EXTRA_VARS")

          export AWX_EXTRA_VARS AWX_MATCH_VARS
          bash "$GITHUB_ACTION_PATH/../_shared/launch-awx-job.sh"
      shell: bash
      env:
        AWX_TEMPLATE_ID: ${{ inputs.awx-services-id }}
        AWX_USERNAME: ${{ inputs.awx-username }}
        AWX_PASSWORD: ${{ inputs.awx-password }}
        AWX_JOB_OUTPUT: job-id
        VPN_CONNECT_SCRIPT: ${{ github.action_path }}/../_shared/connect-vpn.sh

    - name: Wait for Rollback to Complete
      id: rollback
      if: always() && steps.start-rollback.outputs.job-id != ''
      run: bash "$GITHUB_ACTION_PATH/../_shared/poll-awx-job.sh"
      shell: bash
      env:
        AWX_JOB_ID: ${{ steps.start-rollback.outputs.job-id }}
        AWX_USERNAME: ${{ inputs.awx-username }}
        AWX_PASSWORD: ${{ inputs.awx-password }}
        AWX_STATUS_OUTPUT: rollback-status
        AWX_POLL_TIMEOUT: "600"
        VPN_CONNECT_SCRIPT: ${{ github.action_path }}/../_shared/connect-vpn.sh
      
    - name: Disconnect VPN
      if: always()
      run: |
            sudo pkill openvpn || true
            echo "VPN disconnected"
      shell: bash
          
    - name: Send Slack Notification for Deployment
      if: always()
      run: |
          # Determine deployment status
          DEPLOY_STATUS="${{ steps.wait-deploy.outputs.deployment-status }}"
          HEALTH_STATUS="${{ steps.health-check.outputs.health-status }}"
          ROLLBACK_STATUS="${{ steps.rollback.outputs.rollback-status }}"
          
          # Determine overall status and message
          if [[ "$DEPLOY_STATUS" == "success" && ("$HEALTH_STATUS" == "healthy" || "$HEALTH_STATUS" == "") ]]; then
            STATUS="✅ SUCCESS"
            COLOR="good"
            MESSAGE="Deployment completed successfully"
          elif [[ "$DEPLOY_STATUS" == "unknown" ]]; then
            STATUS="⚠️ UNCONFIRMED"
            COLOR="warning"
            MESSAGE="AWX status could not be confirmed; no rollback was started"
          elif [[ "$ROLLBACK_STATUS" == "success" ]]; then
            STATUS="⚠️ ROLLED BACK"
            COLOR="warning"
            MESSAGE="Deployment failed and was rolled back successfully"
          elif [[ "$ROLLBACK_STATUS" == "failed" ]]; then
            STATUS="❌ CRITICAL"
            COLOR="danger"
            MESSAGE="Deployment failed and rollback also failed"
          else
            STATUS="❌ FAILED"
            COLOR="danger"
            MESSAGE="Deployment failed"
          fi
          
          # Prepare Slack payload
          PAYLOAD=$(cat << EOF
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "fields": [
                  {
                    "title": "Deployment Status",
                    "value": "${STATUS}",
                    "short": true
                  },
                  {
                    "title": "Application",
                    "value": "${{ inputs.app-name }}",
                    "short": true
                  },
                  {
                    "title": "Environment",
                    "value": "${{ inputs.deploy-env }}",
                    "short": true
                  },
                  {
                    "title": "Version",
                    "value": "v${{ inputs.version-number }}",
                    "short": true
                  },
                  {
                    "title": "Repository",
                    "value": "${{ github.repository }}",
                    "short": true
                  },
                  {
                    "title": "Branch",
                    "value": "${{ github.ref_name }}",
                    "short": true
                  }
                ],
                "footer": "GitHub Actions",
                "footer_icon": "https://github.com/favicon.ico",
                "ts": $(date +%s)
              }
            ],
            "text": "${MESSAGE}"
          }
          EOF
          )
          
          # Send notification
          curl -X POST -H 'Content-type: application/json' \
            --data "${PAYLOAD}" \
            "${{ inputs.tars-slack-webhook-url }}" \
            || echo "Warning: Slack notification failed"
      shell: bash
